# S26 Ultra per-process view for ghost-stealth.
# Consumed by native gs_install_buf (key=value, '#' comments).
# Matches profiles/spoof/s26-ultra.toml. Per-process ONLY via Zygisk;
# host Houdini (libhoudini.so + x86 abilist) stays intact in base.prop.
# NEVER add ro.hardware here (HAL reads it at boot -> SIGABRT).
# Probe tracing (off by default): debug.trace_probes=1 logs every property
# key and sensitive file open from the target (logcat "probe ...", 4000
# lines/process cap) so detection scans are observed, not guessed.
